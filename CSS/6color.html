<body>
    <h1>Lets learn about colors</h1>
    <p>
        Color can be represented in these ways:
        <ol>
            <li>Color Keywords</li>    <!--normal color name-->
            <li>Hex Color Code</li>     <!--hex color code ex: #00242-->
            <li>RGB</li>                <!--red, blue, green Combination-->
            <li>RGBA</li>               <!--red, blue, green, alpha Combination-->
            <li>HSL</li>                <!--Hue, Saturation, Lightness Combination-->
            <li>HSLA</li>                <!--Hue, Saturation, Lightness, alpha Combination-->
        </ol>
    </p>
