<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css grid 1st method for understanding </title>
    <style>
        .container{
            border:2px solid black;
            display:grid;
            grid-template-columns: [pehla] 120px [doosra] 100px [t];   /* 120px width & 100px width ke column ban jayenge*/  /*first column line name=pehla, second=doosra, third=t*/
            grid-template-rows: 100px 100px 100px;           /*1st row width size=100px, second=100px, third=100px*/
            /* justify-items: center; */           /* main axis box movement */   /*for all grid box movement within grid center/left/right */
            /* align-items: center; */             /* cross axis box movement */   /*for all grid box movement within grid center/left/right */
        }
        .items{
            border:2px solid red;
            height:55px;
            width:55px;
        }
        .item-4{
            grid-row:1/2;              /*row me kitni chaudi jagah mile isse &  Row ki line no. 1 se Row ki line no. 2 tak*/
            /* grid-column:1/2; */
            /* grid-column:doosra/t; */    
            grid-column:1/t;           /*column me kitni chaudi jagah mile isse &  column no. 1 se column no. t tak*/
        }
        .item-1{
            grid-row:1/2;  
            /*or*/
            /* grid-row-start:1;
            grid-row-end:2; */

            grid-column:1/2;
            /* align-self:flex-end; */   /* main axis */   /*for grid perticular box movement*/
            /* justify-self:flex-end; */   /* cross axis */   /*for grid perticular box movement*/
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items item-1">1</div>
        <div class="items item-2">2</div>
        <div class="items item-3">3</div>
        <div class="items item-4">4</div>
        <div class="items item-5">5</div>
    </div>

    <div class="images">
        <div> <img style="margin:5px; border:2px solid black"  height="555" src="grid_understanding.jpg" alt="a grid simplified image1"> </div>
        <div> <img style="margin:5px; border:2px solid black"  height="555" src="grid_line_grid_cell.jpg" alt="a grid simplified image2"> </div>
        <div> <img style="margin:5px; border:2px solid black"  height="555" src="grid_track_grid_area.jpg" alt="a grid simplified image3"> </div>
    </div>
</body>
</html>
