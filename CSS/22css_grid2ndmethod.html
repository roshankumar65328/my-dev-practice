<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> css grid 2nd method for understanding </title>
    <style>
        .container{
            border:2px solid black;
            display:grid;
            grid-template-areas:"nav nav nav "       /*occupying the grid space*/
                                " main side article"
                                "footer links links";
        }
        .items{
            border:2px solid red;
            height:55px;
            width:55px
        }
        .item-1{
            grid-area:nav;          /*defining the item-1 class will on (grid area nav)*/
            background-color: aqua;
        }
        .item-2{
            grid-area:main;
            background-color: antiquewhite;
        }
        .item-3{
            grid-area:side;
            background-color: rgb(213, 164, 100);
        }
        .item-4{
            grid-area:article;
            background-color: rgb(136, 91, 31);
        }
        .item-5{
            grid-area:footer;
            background-color: rgb(79, 182, 223);
        }
        .item-6{
            grid-area:links;
            background-color: aquamarine;
        }
        /* .item-7{
            grid-area:nav ;
        } */
    </style>
</head>
<body>
    <div class="container">
        <div class="items item-1">1</div>
        <div class="items item-2">2</div>
        <div class="items item-3">3</div>
        <div class="items item-4">4</div>
        <div class="items item-5">5</div>
        <div class="items item-6">6</div>
        <div class="items item-7">7</div>
    </div>
</body>
</html>
