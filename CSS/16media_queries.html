<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css media queries for responsiveness</title>
    <style>
        body {
            background-color: red;
        }

        /* @media not|only mediatype and (expression) {
           CSS Code;
        } */
        @media only screen and (max-width:455px) {
            body {
                background-color: blue;
            }

            .boxes {
                flex-direction: column;
            }
        }

        /* for manipulating on landscape/portrait */
        /* @media only screen and (orientation:landscape) {
            body {
                border: 2px solid black;
            }
        } */

        .box {
            width: 344px;
            height: 344px;
            background-color: steelblue;
            margin: 3px;
            padding: 0px;
        }

        .boxes {
            display: flex;
        }
    </style>
</head>

<body>
    <div>
        this is with background color red.
    </div>
    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>

</html>
