<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specificity</title>
    <style>
        /* specificity means if we design same text or things 2+ times with differernt color then which will apply */
        /* the cascading algorithm */
        /* cascading algorithm is using for solving conflict where multiple css rules are apply to html element */
        /* 1. Position and Order Of Appearness 
              The order in which multiple same css rule apply
           2. Specificity
              algorithm that determine which css selector has strongest match
              inline style > ID Selector > Class or Attribute Selector > element selector > Universal Selector 

              Specificity Calculation 
              * universal selector: 0
              * element selector and pseudo element selector : 1
              * class, attribute selector, pseudo-class selector : 10 
              * ID selector: 100
              * Inline style: 1000
           3. Origin 
              css came from browser is called "user agent Stylesheet", developer override the browser owned stylesheet
           4. Important 
              some css specificity rule are weighted than other, Important is gretest than all */

        /* The specificity of this element selector is 1  */
        h1 {
            color: aqua;
        }
        
        /* The specificity of this class selector is 10  */
        .cpurple {
            color: purple;
        }

        /* The specificity of this element+class selector is 1 + 10 = 11  */
        h1.yellow {
            color: yellow;
        }

        /* This is an example of attribute selector. The specificity of this selector is 10 */
        [data-x=a] {
            color: maroon;
        }

        /* The specificity of this class selector is 10  */
        .cred {
            color: red;
        }

        /* The specificity of this selector is 1 + 10 + 10 + 10 + 10 = 41  */
        a.harryclass.rohan-class[href]:hover {   /*a elemen 1, .harryclass 10, rohan-class 10, [href] 10, :hover 10 = 41*/
            color: blueviolet;
        }
        h1{
            color: skyblue !important;   
        }
    </style>
</head>

<body>
    <div>
        <h1 class="yellow cred cpurple" data-x="a">CSS Specificity</h1>
    </div>
</body>

</html>
