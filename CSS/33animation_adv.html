<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> animation advance </title>
    <style>
        .btn{
            padding: 10px 15px;
            border: 3px solid #444;
            border-radius: 8px;
            position:relative;
            font-weight: 600;
            z-index: 1;
        }
        .btn::after{
            content: "";
            background-color: aqua;
            width: 0%;
            position:absolute;
            z-index:-1;
            left: 0;
            top:0;
            transition: all 1s;
        }
        .btn:hover::after{
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <button class="btn">Start Now</button>
</body>
</html>
