<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav bar for ultra language website</title>
    <style>
        .logo {
            width: 90px;
            height: 35px;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .right ul {
            display: flex
        }

        .right ul li {
            list-style: none;
            padding: 0px 15px;
            display: flex;
            align-items: center;
            cursor: pointer;

        }

        .right {
            justify-content:center;
        }

        .right ul li span {
            padding: 1px;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img width="90px" height="35px" src="roshan.jpg" alt="">
            </div>
            <div class="right">
                <ul>
                    <li> <span>Pricing</span> <img width="18px" src="roshan.jpg"> </li>
                    <li> <span>Product</span> <img width="18px" src="roshan.jpg"> </li>
                    <li> <span>Resource</span> <img width="18px" src="roshan.jpg"> </li>
                    <li> <span>About</span> <img width="18px" src="roshan.jpg"> </li>
                    <li><img width="18px" src="roshan.jpg"></li>
                </ul>
            </div>
        </nav>
    </header>
</body>
</html>
