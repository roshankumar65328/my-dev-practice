<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: gray;
        }

        .card {
            background-color: white;
            width: 144px;
            height: 280px;
            border-radius:7px;
        }
        .image{
            padding: 5px;
        }
        .image img{
            border-radius: 7px;

        }
        .content{
            font-size: 10px;
            padding: 5px 0px 0px 13px;
        }
        .capsules span{
            border:2px solid lightgray;
            border-radius:10px;
            font-size:10px;
            padding:1px 5px;
        }
        .capsules{
            padding: 3px 34px 6px 15px;
        }
        .topic{
            margin: 0;
            padding: 0px 0px 6px 0px;
        }
        .button{
            padding: 8px;
            text-align: center;
        }
        .button button{
            background-color: rgb(129, 217, 255);
            border:none;
            border-radius: 13px;
            font-size:10px;
            padding:3px;

        }
   
    </style>
</head>

<body>
    <div class="card">
        <div class="image">
            <img width="134" src="https://wallpapercave.com/wp/wp5613999.jpg" alt="a nature image">
        </div>

    
        <div class="capsules">
            <span>Nature</span>
            <span>Lake</span>
        </div>

        <div class="content">
            <h2 class="topic">Roshan</h2>
            Lorem ipsum dolor sit amet, consectetur adipisicing elit. eveniet repellendus! Aut vitae illo, commodi cum ea ipsa ipsum?
        </div>

        <div class="button">
            <button>Read More</button>
        </div>

    </div>
    
</body>

</html>
