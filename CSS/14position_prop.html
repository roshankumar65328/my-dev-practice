<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css position</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        .box {
            border: 2px solid black;
            height: 180px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
        }

        .box1{
            background-color:lightgreen;
            /* all box class are default apply linewise on page it's called "Static" */
            /* for content movment with "top,bottom,left,right" or setting the z-index first make your container non-static */
            /* position:relative; */  /*must have ralative for manipulate position [jaha fix kiya tha whi se top,bottom,left,right... move karega] */ 
            /* top:40px; */        /*uper se niche ayega*/     /*[jaha fix kiya tha whi se top,bottom,left,right... move karega]*/
            /* bottom:40px; */     /*niche se uper jayega*/
            /* left:40px; */       /*left se right jayega*/
            /* right:40px; */      /*right se left jayega*/

            /* position absolute find the nearest parent or grandparent that is positioned with relative/absoute/fixed/sticky element, the movement of top,bottom,left,right will from that positioned parent element  */
            /* position:absolute;     [ye to absolute hoga hi, iska jo parent absolute hoga uske according position lagegi] */
            /* top:10px; */           /* [ye to absolute hoga hi, iska jo parent absolute hoga uske according position lagegi] */
            /* bottom:10px; */
            /* left:3px; */
            /* right:3px; */

         /* for adding navigation bar on site use position sticky */
            /* position:sticky;
            top:0px;
            height:111px;
            width:100%;
            margin:0px;
            padding:0px; */      
        }
        .box2{
            background-color:lightpink;
            /* position:relative; */     /*must have position relative for setting z-index */
            /* z-index:1; */
        }
        .box3{
            background-color:lightgray;
            /* for position fixed like below ad in some site */
            /* position:fixed;
            bottom:0px;
            left:25vw; */
        }
        .box4{
            background-color:lightblue;
            position:absolute;    /*it will find its parent is positioned or not. if not, it will find its further parent positioned or not, in last it will adjust at top of the page*/    
            top:0px;
        }

        .parent{
            padding:30px;
            margin:20px;
            border:2px solid purple;

            /* for absolute make the first parent absolute */
            /* position:absolute; */
            /* Exeption-> translate, filter, or perspective properties can also make an element appear as positioned */
            /* position:absolute; */
            /* transform:translate(0);   
               filter:invert(0); 
               perspective:0em;  */
        }
    </style>
</head>

<body>
    <div class="parent">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    </div>
    <p>roshan</p>
</body>

</html>
