        /*box class ke ander first line*/   /* pseudo element selector specificity value = 1 */

        /*boxes class ke ander universal sab kuch*/
        /* .boxes *{
            color: blue;

        } */

        /*sab box class me odd ya even ko select karna*/  /* counting starts from 1 */
        /* .box:nth-child(odd){
            background-color: blue;
        } */

        /*box class jaha bhi 2nd no. pe hoga*/
        /* .box:nth-child(2){
            background-color: blue;
        } */

        /*box class last se 2nd no. pe jaha bhi hoga*/
        /* .box:nth-last-child(2){
            background-color: red;
        } */

        /*.boxes class me usse just pehle kuch add karna*/     /* pseudo element selector specificity value = 1 */
        .boxes::before {
            content: "i am good";
            color: blue;
        }

        /*.boxes class me usse just baad kuch add karna*/
        .boxes::after {
            content: "This course is also good";
            color: red;
        }

        /*when we select text in webpage*/
        ::selection {
            background-color: black;
            color: aqua;
        }

        /*.box class me first letter*/
        .box::first-letter {
            color: peru;
            font-size: 45px;
        }

        /*input tag ko manipulate karna*/
        input::placeholder {
            color: rgb(84, 84, 188);
        }
    </style>
</head>

<body>
    <div class="boxes">
        <div data-color="primary" class="boxe">I am first box</div>
        <div class="box">Hey I am a box</div>
        <div class="box">Hey I am a box</div>
        <input type="text" placeholder="Type your name here">
    </div>
</body>
