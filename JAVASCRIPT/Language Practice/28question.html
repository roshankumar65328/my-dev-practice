<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Question for hacking terminal </title>

    <style>
        body {
            background-color: green;
            color: white;
            font-family: 'Martel Sans', sans-serif;
            font-size: 30px;
        }
    </style>
</head>

<body>
    <!-- Create a hacking simulator which has green background and it shows these messages with random delay of 1 to 7 seconds 
    
    Initializing Hacking...
    Reading your Files...
    Password files Detected...
    Sending all passwords and personal files to server...
    Cleaning up...

    The three dots must blink so that it looks like a real terminal
    -->

    <div>Initializing the Data</div>
    <script>

       const addItem = async(item)=>{
        await randomDelay();
        let r = document.createElement("div")
        r.innerHTML = item;
        document.body.append(r)     // body me append kr diya (r) ko
        
       }

       const randomDelay =()=>{
        return new Promise((resolve, reject)=>{
            timeout = 1 +6 *Math.random();
            console.log(timeout);
            
            setTimeout(()=>{
                resolve()
            },timeout *1000)
        })
       }


        async function main() {


            let t = setInterval(() => {
                let last = document.body.getElementsByTagName("div");
                last = last[last.length - 1]
                if (last.innerHTML.endsWith("...")) {
                    last.innerHTML = last.innerHTML.slice(0, last.innerHTML.length - 3)
                } else {
                    last.innerHTML = last.innerHTML + "."
                }
            }, 100)


             let text = ["Initialized Hacking now reading your data",
            "Reading your Files",
            "Password files Detected",
            "Sending all passwords and personal files to server",
            "Cleaning up"]

            for(const item of text){
                await addItem(item)
            }
            // or 
            // for(const key in text){
            //     await addItem(text[key])
            // }

            await randomDelay()
            clearInterval(t)


        }
        main()


    </script>

</body>

</html>
