<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Put different color using Dom</title>
    <style>
        .container{
            display:flex;
            justify-content: center;
            align-items:center;
            gap:23px;
        }
        .box{
            display:flex;
            justify-content: center;
            align-items:center;
            height:45px;
            width:45px;
            border:3px solid black;
            color:getRandomColor();  
        }
    </style>
</head>
<body>
    <!--given 5 boxes , assign random color & random background using Dom Concept-->
    <div class="container">
        <div class="box">box1</div>
        <div class="box">box2</div>
        <div class="box">box3</div>
        <div class="box">box4</div>
        <div class="box">box5</div>
    </div>
    <script src="16question.js"></script>
</body>
</html>
