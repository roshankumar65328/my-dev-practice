<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Javascript Dom Introduction </title>
</head>
<body>
    <div class="container">
        <div class="box">
            this is a box
        </div>
    </div>
    
    <script>
        document.title = "Js dom title"   //for update title
        console.log(document.title)      // print title on console
        console.log(document.body)      // print whole body on console
        document.body.style.backgroundColor = "gray";   // after style must follow "camelCasing"
        // document.body.style.backgroundColor = "skyblue";
        
    </script>
</body>
</html>
