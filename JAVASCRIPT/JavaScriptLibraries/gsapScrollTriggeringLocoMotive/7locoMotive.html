<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.css">
    <link rel="stylesheet" href="7locoMotive.css">
    <title> locomotive </title>
</head>
<body>

    <!-- locomotive code ke liye hame locomotive ka css,js CDN ko html me link karna hoga

    scroll karne ke liye locomotive ke github se scroll ke niche, ke niche ka code lake apni main js file me dalni h
            "  const scroll = new LocomotiveScroll({
                el: document.querySelector('.parent'),
                smooth: true
            });  "
    document.querySelector('.parent') ke jageh pr apna main container dalna hai
    your scroll effect is ready on website -->

    <div class="main">     <!--locomotive ke liye ek parent container jaruri hai chizo ko wrap karne ke liye & main ko height percentage (%) me nhi deni hai vh me de sakte h, as choice dena h to wese nahi dena chahiye-->
        <div class="page1"></div>
        <div class="page2">
            <div class="image"><img data-scroll data-scroll-speed="3" src="img3.jpg" alt=""></div>     <!--added attribute data-scroll data-scroll-speed="2" for this image speed different to scrolling-->
        </div>
        <div class="page3"></div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.js"></script>
    <script src="7locoMotive.js"></script>
</body>
</html>
